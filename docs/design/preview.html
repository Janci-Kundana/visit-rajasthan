<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mockups</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#1e1e1e;font-family:sans-serif}
main{max-width:900px;margin:0 auto;padding:24px;display:grid;gap:24px}
.box{background:#fff;border:2px solid #1e1e1e;border-radius:10px;padding:16px}
.bar{background:#0b0907;color:#fff;padding:8px 12px;border-radius:6px;display:flex;justify-content:space-between}
.hero{background:#e0f2fe;border:2px dashed #1e1e1e;border-radius:6px;text-align:center;padding:20px;margin-top:12px}
.row{display:flex;gap:12px;margin-top:12px}.row div{flex:1;border:2px solid #1e1e1e;border-radius:6px;padding:12px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{border:2px solid #1e1e1e;border-radius:6px;padding:12px;text-align:center}
.list{display:grid;gap:8px;margin-top:12px}.list div{border:2px solid #1e1e1e;border-radius:6px;padding:10px;text-align:center}
h2{margin:0 0 12px;font-size:20px}
</style>
</head>
<body>
<main>
<div class="box"><h2>01 Home</h2><div class="bar"><span>Header</span><span>Nav</span></div><div class="hero">Hero<br>Title<br>Sub</div><div class="row"><div>Info</div><div>Button</div></div></div>
<div class="box"><h2>02 Grid</h2><div class="bar"><span>Header</span><span>Nav</span></div><div class="grid"><div class="card">Image<br>Name<br>Link</div><div class="card">Image<br>Name<br>Link</div><div class="card">Image<br>Name<br>Link</div><div class="card">Image<br>Name<br>Link</div></div></div>
<div class="box"><h2>03 Guide</h2><div class="list"><div>Hero Title</div><div>Lede</div><div>Facts</div><div>Text</div><div>Cards</div><div>Map</div><div>Nav</div></div></div>
<div class="box"><h2>04 About</h2><div class="row"><div>About<br>Text<br>Credits</div><div>Home<br>Places<br>About<br>Guide</div></div></div>
</main>
</body>
</html>
