<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tile QA</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        background: #dfeaf5;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #23425c;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        padding: 6px;
      }
      .cell { position: relative; background: #eaf2fa; border-radius: 10px; overflow: hidden; }
      .cell canvas { display: block; width: 100%; height: 100%; }
      .tag {
        position: absolute; left: 10px; top: 8px;
        font-weight: 700; letter-spacing: .02em;
        background: rgba(255,255,255,.82); padding: 3px 9px; border-radius: 99px;
      }
      .err { position: absolute; left: 10px; bottom: 8px; color: #b3261e; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
